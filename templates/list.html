{% extends "base.html" %}
{% block content %}
<h1>메모 목록</h1>
{% if memos %}
  {% for memo in memos %}
  <div class="memo-item">
    <a href="/memos/{{ memo.id }}">{{ memo.title }}</a>
    <span> — {{ memo.created_at.strftime("%Y-%m-%d %H:%M") }}</span>
  </div>
  {% endfor %}
{% else %}
  <p>등록된 메모가 없습니다.</p>
{% endif %}
<p class="actions"><a class="button" href="/memos/new">새 메모 작성</a></p>
{% endblock %}
